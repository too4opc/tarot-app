[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# frontend เรียก /api/tarot-ai แทนที่จะรู้ path เต็มของ Netlify Function
# ข้อดี: same-origin กับหน้าเว็บ ไม่ต้องยุ่งกับ CORS เลย
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"
